<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дневник питания</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Дневник питания</h1>
    </header>

    <nav>
      <ul>
        <li><a href="index.html">Калькулятор</a></li>
        <li><a href="diary.html" class="active">Дневник</a></li>
        <li><a href="products.html">Продукты</a></li>
        <li><a href="statistics.html">Статистика</a></li>
      </ul>
    </nav>

    <main>
      <h2 class="animate-on-load delay-1">Добавить приём пищи</h2>
      <form id="diary-form" class="animate-on-load delay-2">
        <div class="form-group">
          <label for="product-name">Название продукта:</label>
          <input
            type="text"
            id="product-name"
            placeholder="Например: Овсянка"
            required
          />
        </div>

        <div class="form-group">
          <label for="product-weight">Вес порции (г):</label>
          <input
            type="number"
            id="product-weight"
            min="1"
            max="5000"
            placeholder="100"
            required
          />
        </div>

        <div class="form-group">
          <label for="product-calories">Калории (на 100г):</label>
          <input
            type="number"
            id="product-calories"
            min="0"
            placeholder="88"
            required
          />
        </div>

        <div class="form-group">
          <label for="product-proteins">Белки (на 100г, г):</label>
          <input
            type="number"
            id="product-proteins"
            min="0"
            step="0.1"
            placeholder="3"
            required
          />
        </div>

        <div class="form-group">
          <label for="product-fats">Жиры (на 100г, г):</label>
          <input
            type="number"
            id="product-fats"
            min="0"
            step="0.1"
            placeholder="1.7"
            required
          />
        </div>

        <div class="form-group">
          <label for="product-carbs">Углеводы (на 100г, г):</label>
          <input
            type="number"
            id="product-carbs"
            min="0"
            step="0.1"
            placeholder="15"
            required
          />
        </div>

        <button type="submit">Добавить в дневник</button>
      </form>
      <h2 class="animate-on-load delay-3">Записи за сегодня</h2>
      <div id="entries-list" class="animate-on-load delay-3">
        <div class="empty-state">
          <div class="empty-icon"></div>
          <h3>Дневник пока пуст</h3>
          <p>Добавьте свой первый продукт, чтобы начать отслеживать питание!</p>
        </div>
      </div>

      <div
        id="total-box"
        class="total-box animate-on-load delay-4"
        style="display: none"
      >
        <!-- Сюда JavaScript вставит итоги -->
      </div>

      <button
        onclick="clearDiary()"
        class="animate-on-load delay-5"
        style="background: #e74c3c; margin-top: 1rem"
      >
        Очистить дневник
      </button>
    </main>
    <div id="toast-container"></div>
    <footer>
      <p>© 2026 Калькулятор калорий. Все права защищены.</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
